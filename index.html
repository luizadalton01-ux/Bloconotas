<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caderno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF8EC;
    --paper-soft:#FFEFD6;
    --ink:#2B2A4A;
    --ink-soft:#6B6A8F;
    --turq:#2FB6B0;
    --turq-bg:#DFF6F4;
    --coral:#FF6B6B;
    --coral-bg:#FFE3E3;
    --amber:#F5A623;
    --amber-bg:#FFF0D6;
    --blue:#3D8BFD;
    --lime:#8BD450;
    --ok:#2FBF71;
    --recipe:#9B6BE0;
    --recipe-bg:#EFE6FB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Quicksand', sans-serif;
    background:linear-gradient(160deg,#1c3a4a,#0f2430);
    color:var(--ink);
    display:flex; justify-content:center; overflow:hidden;
  }
  #app{
    width:100%; max-width:480px; height:100vh; height:100dvh;
    background:var(--paper);
    position:relative; overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.5);
    border-radius:0;
  }
  h1,h2,h3{font-family:'Fredoka',sans-serif; margin:0;}
  .screen{position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; overflow:hidden;}

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px;
    background:radial-gradient(circle at 30% 20%, var(--turq-bg), transparent 60%),
               radial-gradient(circle at 80% 80%, var(--coral-bg), transparent 55%),
               var(--paper);
  }
  #lock h1{font-size:46px; background:linear-gradient(90deg,var(--blue),var(--lime)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .pin-dots{display:flex; gap:14px; margin:6px 0 10px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue); background:transparent;}
  .pin-dot.filled{background:var(--blue);}
  .keypad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .key{
    height:64px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 3px 0 #e6ddf5;
    font-family:'Fredoka',sans-serif; font-size:20px; color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .key:active{background:var(--blue); color:#fff; box-shadow:none; transform:translateY(2px);}
  #lock-msg{font-size:13px; color:var(--coral); min-height:16px; font-weight:600;}
  #setup-note{font-size:12px; color:var(--ink-soft); max-width:280px; line-height:1.5;}
  #lock-cancel{position:absolute; top:16px; left:16px;}
  #forgot-pin-btn{margin-top:2px;}
  #recovery-setup, #recovery-answer-wrap{width:100%; max-width:280px;}
  #recovery-question-display{font-size:13px; color:var(--ink-soft); font-weight:700; line-height:1.4;}

  /* ---------- HEADER ---------- */
  header{
    padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(120deg,#2C9CDB,#4FD6A8);
    border-radius:0 0 22px 22px;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
    flex:none;
  }
  header h1{font-size:28px; color:#fff;}
  .header-right{display:flex; align-items:center; gap:6px;}
  .icon-btn{
    width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,.25); color:#fff; font-size:16px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.active-state{background:#fff; color:var(--blue);}
  #sync-dot{width:8px;height:8px;border-radius:50%; background:rgba(255,255,255,.5); display:inline-block;}
  #sync-dot.on{background:var(--ok);}
  #last-saved-label{font-size:10px; color:var(--ink-soft); opacity:.85; font-weight:600; text-align:right;}

  /* ---------- SEARCH BAR ---------- */
  #search-wrap{padding:0 20px; max-height:0; overflow:hidden; transition:max-height .2s ease, padding .2s ease;}
  #search-wrap.open{max-height:60px; padding:10px 20px 0;}
  #search-input{
    width:100%; border:none; border-radius:14px; padding:10px 14px;
    background:#fff; font-family:'Quicksand',sans-serif; font-size:14px; color:var(--ink);
    box-shadow:0 2px 6px rgba(0,0,0,.06); outline:none;
  }
  #sort-label{
    padding:8px 20px 0; font-size:11px; color:var(--ink-soft); font-weight:700;
    display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  }

  /* ---------- LIST ---------- */
  #list{flex:1; overflow-y:auto; padding:12px 18px 100px;}
  .empty{color:var(--ink-soft); font-size:14px; margin-top:40px; line-height:1.6; text-align:center;}
  .empty .big{font-size:38px; display:block; margin-bottom:8px;}
  .card{
    background:#fff;
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(43,42,74,.07);
    border-left:5px solid var(--ink-soft);
    display:flex; gap:12px; align-items:flex-start;
  }
  .card .badge{
    width:34px;height:34px;border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .card.rascunho{border-left-color:var(--turq);}
  .card.rascunho .badge{background:var(--turq-bg); color:var(--turq);}
  .card.lembrete{border-left-color:var(--coral);}
  .card.lembrete .badge{background:var(--coral-bg); color:var(--coral);}
  .card.senha{border-left-color:var(--amber);}
  .card.senha .badge{background:var(--amber-bg); color:var(--amber);}
  .card.receita{border-left-color:var(--recipe);}
  .card.receita .badge{background:var(--recipe-bg); color:var(--recipe);}
  .card-content{min-width:0; flex:1;}
  .card-title{font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; color:var(--ink); margin-bottom:2px;}
  .card-body{font-size:13px; color:var(--ink-soft); white-space:pre-wrap; max-height:36px; overflow:hidden;}
  .card-meta{margin-top:6px; font-size:11px; font-weight:700;}
  .card-meta.lembrete{color:var(--coral);}
  .card-meta.senha{color:var(--amber);}

  /* ---------- TABS ---------- */
  #tabbar{
    display:flex; flex:none; z-index:2; background:#fff;
    box-shadow:0 -4px 14px rgba(0,0,0,.06);
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .tab-btn{
    flex:1; padding:10px 4px 12px; background:none; border:none; cursor:pointer;
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:11px; color:var(--ink-soft);
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tab-btn .icon{font-size:19px;}
  .tab-btn[data-tab="rascunhos"].active{color:var(--turq);}
  .tab-btn[data-tab="lembretes"].active{color:var(--coral);}
  .tab-btn[data-tab="receitas"].active{color:var(--recipe);}
  .tab-btn[data-tab="senhas"].active{color:var(--amber);}
  .tab-btn.active{transform:translateY(-2px);}

  /* ---------- VERSÃO DO APP ---------- */
  #version-tag{
    position:absolute; right:14px; bottom:80px; z-index:2;
    font-size:10px; color:var(--ink-soft); opacity:.55;
    font-weight:600; pointer-events:none;
  }

  /* ---------- FAB ---------- */
  #fab{
    position:absolute; right:20px; bottom:82px; z-index:3;
    width:58px; height:58px; border-radius:50%;
    background:linear-gradient(135deg,var(--blue),var(--lime)); color:#fff;
    font-size:28px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(61,139,253,.4);
  }

  /* ---------- EDITOR ---------- */
  #editor{padding:16px 20px 20px; display:none; flex-direction:column; gap:12px; flex:1; overflow-y:auto;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .link-btn{background:none;border:none;color:var(--ink-soft); font-family:'Quicksand',sans-serif; font-weight:700; font-size:13px; cursor:pointer;}
  .link-btn.danger{color:var(--coral);}
  label.field-label{font-size:11px; color:var(--ink-soft); font-weight:700; margin-bottom:-6px;}
  input[type=text], input[type=password], textarea, input[type=datetime-local]{
    font-family:'Quicksand',sans-serif;
    border:1px solid #eee; border-radius:12px; background:#fbfbfd;
    padding:11px 13px; color:var(--ink); outline:none; width:100%; font-size:14px;
  }
  input:focus, textarea:focus{border-color:var(--blue);}
  #editor-title-input{font-family:'Fredoka',sans-serif; font-size:20px; font-weight:600;}
  textarea{min-height:140px; resize:vertical; line-height:1.6;}
  .field-grow{flex:1 1 auto; min-height:200px;}
  #fields-rascunhos, #fields-lembretes, #fields-receitas{flex:1;}
  .pw-row{display:flex; align-items:center; gap:8px;}
  .pw-row input{flex:1;}
  .save-bar{margin-top:auto; padding-top:12px;}
  .btn{
    width:100%; padding:14px; border:none; border-radius:14px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; cursor:pointer;
  }
  .btn-primary{background:linear-gradient(120deg,var(--blue),var(--lime)); color:#fff; box-shadow:0 5px 14px rgba(61,139,253,.4);}
  .toast{
    position:absolute; bottom:150px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:9px 18px; border-radius:20px;
    font-size:12px; font-weight:600; z-index:6; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- LOCK (protege apenas a aba Senhas) -->
  <div id="lock" class="screen" style="display:none;">
    <button class="link-btn" id="lock-cancel" onclick="cancelLock()">‹ Cancelar</button>
    <h1 id="lock-title">Caderno</h1>
    <div class="pin-dots" id="pin-dots"></div>
    <div id="lock-msg"></div>
    <div class="keypad" id="keypad"></div>
    <div id="setup-note"></div>

    <div id="recovery-setup" style="display:none; flex-direction:column; gap:10px;">
      <label class="field-label">Pergunta de recuperação</label>
      <input id="recovery-question-input" type="text" placeholder="Ex: nome do meu primeiro pet">
      <label class="field-label">Resposta secreta</label>
      <input id="recovery-answer-input" type="text" placeholder="Resposta">
      <button class="btn btn-primary" onclick="confirmRecoverySetup()">Continuar</button>
    </div>

    <div id="recovery-answer-wrap" style="display:none; flex-direction:column; gap:10px;">
      <div id="recovery-question-display"></div>
      <input id="recovery-answer-check" type="text" placeholder="Sua resposta">
      <button class="btn btn-primary" onclick="checkRecoveryAnswer()">Verificar</button>
    </div>

    <button class="link-btn" id="forgot-pin-btn" onclick="startRecovery()" style="display:none;">Esqueci meu PIN</button>
  </div>

  <!-- MAIN -->
  <div id="main" class="screen" style="display:none;">
    <header>
      <h1 id="section-title">Rascunhos</h1>
      <div class="header-right">
        <button class="icon-btn" id="save-btn" onclick="manualSave()" title="Salvar na nuvem">☁️</button>
        <button class="icon-btn" id="search-btn" onclick="toggleSearch()">🔍</button>
        <button class="icon-btn" id="sort-btn" onclick="toggleSort()">↕️</button>
        <span id="sync-dot" onclick="showSyncInfo()" style="cursor:pointer;"></span>
      </div>
    </header>
    <div id="search-wrap"><input id="search-input" type="text" placeholder="Buscar..." oninput="renderList()"></div>
    <div id="sort-label">
      <span>Ordenar: <span id="sort-current">mais recentes</span></span>
      <span id="last-saved-label">Ainda não salvo na nuvem</span>
    </div>
    <div id="list"></div>
    <div id="version-tag"></div>
    <button id="fab" onclick="openEditor(null)">+</button>
    <div id="tabbar">
      <button class="tab-btn active" data-tab="rascunhos" onclick="switchTab('rascunhos')">
        <span class="icon">📝</span>Rascunhos
      </button>
      <button class="tab-btn" data-tab="lembretes" onclick="switchTab('lembretes')">
        <span class="icon">🔔</span>Lembretes
      </button>
      <button class="tab-btn" data-tab="receitas" onclick="switchTab('receitas')">
        <span class="icon">🍲</span>Receitas
      </button>
      <button class="tab-btn" data-tab="senhas" onclick="switchTab('senhas')">
        <span class="icon">🔑</span>Senhas
      </button>
    </div>
  </div>

  <!-- EDITOR -->
  <div id="editor" class="screen">
    <div class="topbar">
      <button class="link-btn" onclick="closeEditor()">‹ Voltar</button>
      <button class="link-btn danger" id="delete-btn" onclick="deleteCurrentItem()" style="display:none;">Excluir</button>
    </div>

    <div id="fields-rascunhos" style="display:none; flex-direction:column; gap:12px;">
      <input id="rascunho-title" type="text" placeholder="Título">
      <textarea id="rascunho-body" class="field-grow" placeholder="Escreva aqui..."></textarea>
    </div>

    <div id="fields-lembretes" style="display:none; flex-direction:column; gap:12px;">
      <input id="lembrete-title" type="text" placeholder="Título do lembrete">
      <textarea id="lembrete-body" class="field-grow" placeholder="Detalhes (opcional)" style="min-height:120px;"></textarea>
      <label class="field-label">Data e hora</label>
      <input id="lembrete-when" type="datetime-local">
    </div>

    <div id="fields-receitas" style="display:none; flex-direction:column; gap:12px;">
      <input id="receita-title" type="text" placeholder="Nome da receita">
      <textarea id="receita-ingredientes" class="field-grow" placeholder="Ingredientes..." style="min-height:150px;"></textarea>
      <textarea id="receita-preparo" class="field-grow" placeholder="Modo de preparo..." style="min-height:200px;"></textarea>
    </div>

    <div id="fields-senhas" style="display:none; flex-direction:column; gap:12px;">
      <input id="senha-site" type="text" placeholder="Site / Serviço">
      <input id="senha-user" type="text" placeholder="Usuário / E-mail">
      <div class="pw-row">
        <input id="senha-pass" type="password" placeholder="Senha">
        <button class="link-btn" onclick="togglePassVisibility()">mostrar</button>
      </div>
      <textarea id="senha-notas" placeholder="Notas (opcional)" style="min-height:70px;"></textarea>
    </div>

    <div class="save-bar">
      <button class="btn btn-primary" onclick="saveCurrentItem()">Salvar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script type="module">
/* =========================================================================
   CONFIGURAÇÃO DO FIREBASE
   -------------------------------------------------------------------------
   1. https://console.firebase.google.com → crie um projeto (grátis).
   2. Ative "Firestore Database".
   3. Configurações do projeto → Seus apps → app Web (</>) → copie o objeto
      de configuração para firebaseConfig abaixo.
   4. Regra rápida para testar (troque depois por regras com autenticação):
        allow read, write: if true;
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAp8t81f1VHOjqyt1PhFngfIbUHfUtZP64",
  authDomain: "bloco-de-notas-2cfba.firebaseapp.com",
  projectId: "bloco-de-notas-2cfba",
  storageBucket: "bloco-de-notas-2cfba.firebasestorage.app",
  messagingSenderId: "623385731054",
  appId: "1:623385731054:web:522dfcda0cb92fbbbeb8ff",
  measurementId: "G-S3V3VVJ971"
};
const NOTEBOOK_ID = "meu-caderno";

let db = null;
let firebaseReady = false;
let lastFirebaseError = null; // guarda o motivo legível da última falha, para diagnóstico

/* Evita que o app fique esperando para sempre uma resposta do Firebase que
   nunca chega (comum quando a rede bloqueia silenciosamente a conexão) */
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error(`Tempo esgotado ao ${label}`)), ms)
    )
  ]);
}

async function initFirebase() {
  try {
    const { initializeApp } = await withTimeout(
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"), 10000, "carregar o Firebase (app)"
    );
    const { getFirestore, doc, getDoc, setDoc } = await withTimeout(
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"), 10000, "carregar o Firebase (banco)"
    );
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    window.__fb = { doc, getDoc, setDoc };
    firebaseReady = true;
    lastFirebaseError = null;
    setSyncStatus(true);

    // Analytics é opcional: se o domínio não estiver autorizado no console
    // do Firebase, isso falha silenciosamente sem afetar o restante do app.
    try {
      const { getAnalytics } = await withTimeout(
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js"), 8000, "carregar o Analytics"
      );
      getAnalytics(app);
    } catch (eAnalytics) {
      console.warn("Analytics não inicializado:", eAnalytics);
    }
  } catch (e) {
    console.error("Firebase não conectado:", e);
    firebaseReady = false;
    lastFirebaseError = describeFirebaseError(e);
    setSyncStatus(false);
  }
}

/* Traduz o erro técnico em uma mensagem curta e legível para mostrar na tela */
function describeFirebaseError(e) {
  const msg = (e && (e.message || e.code || String(e))) || "erro desconhecido";
  if (/Tempo esgotado/i.test(msg)) {
    return "conexão travou (rede bloqueando o Firebase silenciosamente)";
  }
  if (/Failed to fetch dynamically imported module|NetworkError|Failed to fetch/i.test(msg)) {
    return "sem acesso à internet / rede bloqueada";
  }
  if (/permission-denied/i.test(msg)) {
    return "permissão negada nas regras do Firestore";
  }
  if (/not-found|Cloud Firestore API|database.*not.*exist/i.test(msg)) {
    return "banco Firestore não criado no projeto";
  }
  return msg.slice(0, 80);
}

function setSyncStatus(on) {
  document.getElementById('sync-dot').classList.toggle('on', on);
}

/* =========================================================================
   HISTÓRICO DE VERSÕES
   -------------------------------------------------------------------------
   v1.0.0 — versão original (rascunhos, lembretes, senhas; PIN geral de
            entrada; armazenamento na nuvem via Firebase/Firestore).
   v1.1.0 — adicionada aba "Receitas"; PIN passou a proteger somente a aba
            "Senhas" (app abre direto, sem senha de entrada); adicionada
            recuperação de PIN por pergunta secreta; campos de texto dos
            editores (rascunho, lembrete, receita) aumentados para ocupar
            a tela; configuração real do Firebase conectada.
   ========================================================================= */
const APP_VERSION = "1.1.0";

/* =========================== ESTADO EM MEMÓRIA =========================== */
let data = {
  pin: null,
  recovery: null, // { question, answer }
  rascunhos: [],
  lembretes: [],
  receitas: [],
  senhas: []
};
let pinBuffer = "";
let mode = "checkPin"; // createPin | checkPin | createRecovery | recoverAnswer | resetPin
let activeTab = "rascunhos";
let currentEditId = null;
let scheduledTimers = {};
let searchOpen = false;
let sortMode = "data"; // "data" | "titulo"
let senhasUnlocked = false;
let lockReturnTab = "rascunhos";

const TAB_LABELS = { rascunhos: "Rascunhos", lembretes: "Lembretes", receitas: "Receitas", senhas: "Senhas" };
const TAB_ICON = { rascunhos: "📝", lembretes: "🔔", receitas: "🍲", senhas: "🔑" };

/* =========================== PERSISTÊNCIA =========================== */
/* Armazenamento local: o app abre e funciona mesmo sem internet/nuvem.
   O Firebase, quando disponível, sincroniza por cima em segundo plano. */
const LOCAL_KEY = "caderno_app_dados_v1";

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    data.pin = d.pin || null;
    data.recovery = d.recovery || null;
    data.rascunhos = d.rascunhos || [];
    data.lembretes = d.lembretes || [];
    data.receitas = d.receitas || [];
    data.senhas = d.senhas || [];
  } catch (e) {
    console.warn("Armazenamento local indisponível:", e);
  }
}

function saveToLocalStorage() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Não foi possível salvar localmente:", e);
  }
}

async function loadFromCloud() {
  if (!firebaseReady) return;
  try {
    const { doc, getDoc } = window.__fb;
    const ref = doc(db, "notebooks", NOTEBOOK_ID);
    const snap = await withTimeout(getDoc(ref), 10000, "carregar os dados da nuvem");
    if (snap.exists()) {
      const d = snap.data();
      data.pin = d.pin || null;
      data.recovery = d.recovery || null;
      data.rascunhos = d.rascunhos || [];
      data.lembretes = d.lembretes || [];
      data.receitas = d.receitas || [];
      data.senhas = d.senhas || [];
      saveToLocalStorage();
    }
  } catch (e) {
    console.warn("Não foi possível carregar da nuvem, usando dados locais:", e);
    firebaseReady = false;
    lastFirebaseError = describeFirebaseError(e);
    setSyncStatus(false);
  }
}

/* ---- Data/hora do último salvamento na nuvem ---- */
const LAST_SYNC_KEY = "caderno_ultimo_salvamento_v1";
let lastSyncAt = null;

function loadLastSyncFromLocal() {
  try {
    const raw = localStorage.getItem(LAST_SYNC_KEY);
    if (raw) lastSyncAt = parseInt(raw, 10) || null;
  } catch (e) { /* ignora */ }
}

function updateLastSyncLabel() {
  const el = document.getElementById('last-saved-label');
  if (!el) return;
  if (!lastSyncAt) { el.textContent = "Ainda não salvo na nuvem"; return; }
  const d = new Date(lastSyncAt);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const dateStr = sameDay ? "hoje" : d.toLocaleDateString('pt-BR');
  el.textContent = `Salvo ${dateStr} às ${time}`;
}

async function saveToCloud() {
  saveToLocalStorage();
  if (!firebaseReady) return false;
  try {
    const { doc, setDoc } = window.__fb;
    const ref = doc(db, "notebooks", NOTEBOOK_ID);
    await withTimeout(setDoc(ref, data, { merge: true }), 10000, "salvar na nuvem");
    lastSyncAt = Date.now();
    try { localStorage.setItem(LAST_SYNC_KEY, String(lastSyncAt)); } catch (e) { /* ignora */ }
    updateLastSyncLabel();
    return true;
  } catch (e) {
    console.warn("Falha ao sincronizar com a nuvem, dados mantidos localmente:", e);
    firebaseReady = false;
    lastFirebaseError = describeFirebaseError(e);
    setSyncStatus(false);
    return false;
  }
}

/* Botão "Salvar na nuvem" no cabeçalho: força uma tentativa de sincronização agora */
async function manualSave() {
  const btn = document.getElementById('save-btn');
  if (btn) btn.classList.add('active-state');
  showToast("☁️ Salvando...");
  if (!firebaseReady) {
    try { await initFirebase(); } catch (e) { /* segue tentando abaixo */ }
  }
  const ok = await saveToCloud();
  if (btn) btn.classList.remove('active-state');
  showToast(ok ? "☁️ Salvo na nuvem" : "⚠️ Não salvou na nuvem: " + (lastFirebaseError || "motivo desconhecido"));
}
window.manualSave = manualSave;

/* Toque na bolinha de status mostra o motivo da falha (diagnóstico) */
function showSyncInfo() {
  if (firebaseReady) {
    showToast("☁️ Conectado à nuvem" + (lastSyncAt ? " • último salvamento registrado" : ""));
  } else {
    showToast("🔴 Sem nuvem: " + (lastFirebaseError || "ainda não tentou conectar"));
  }
}
window.showSyncInfo = showSyncInfo;

/* =========================== TELA DE PIN (protege apenas "Senhas") =========================== */
const PIN_MODES = ["createPin", "checkPin", "resetPin"];

function renderLock() {
  const showKeypad = PIN_MODES.includes(mode);
  document.getElementById('keypad').style.display = showKeypad ? 'grid' : 'none';
  document.getElementById('pin-dots').style.display = showKeypad ? 'flex' : 'none';
  document.getElementById('recovery-setup').style.display = mode === 'createRecovery' ? 'flex' : 'none';
  document.getElementById('recovery-answer-wrap').style.display = mode === 'recoverAnswer' ? 'flex' : 'none';
  document.getElementById('forgot-pin-btn').style.display = (mode === 'checkPin' && data.recovery) ? 'block' : 'none';

  const titles = {
    createPin: "Crie um PIN",
    checkPin: "Senhas 🔒",
    createRecovery: "Recuperação",
    recoverAnswer: "Recuperar PIN",
    resetPin: "Novo PIN"
  };
  document.getElementById('lock-title').textContent = titles[mode] || "Caderno";

  const notes = {
    createPin: "Defina um PIN de 4 dígitos para proteger a aba Senhas.",
    checkPin: "",
    createRecovery: "Configure uma pergunta para recuperar seu PIN caso esqueça.",
    recoverAnswer: "",
    resetPin: "Digite um novo PIN de 4 dígitos."
  };
  document.getElementById('setup-note').textContent = notes[mode] || "";
  document.getElementById('lock-msg').textContent = "";

  if (showKeypad) { buildKeypad(); renderPinDots(); }
}

function buildKeypad() {
  const el = document.getElementById('keypad');
  el.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key';
    b.textContent = k;
    if (k === "") b.style.visibility = "hidden";
    b.onclick = () => handleKey(k);
    el.appendChild(b);
  });
}

function renderPinDots() {
  const el = document.getElementById('pin-dots');
  el.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
    el.appendChild(d);
  }
}

function handleKey(k) {
  const msg = document.getElementById('lock-msg');
  msg.textContent = "";
  if (k === "⌫") { pinBuffer = pinBuffer.slice(0, -1); renderPinDots(); return; }
  if (k === "" || pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length === 4) {
    if (mode === "createPin") {
      // Guarda o PIN temporariamente; a etapa seguinte define a recuperação.
      data.pinPending = pinBuffer;
      pinBuffer = "";
      mode = "createRecovery";
      renderLock();
    } else if (mode === "resetPin") {
      data.pin = pinBuffer;
      pinBuffer = "";
      saveToCloud();
      finishSenhasUnlock();
    } else {
      if (pinBuffer === data.pin) {
        pinBuffer = "";
        finishSenhasUnlock();
      } else {
        msg.textContent = "PIN incorreto";
        setTimeout(() => { pinBuffer = ""; renderPinDots(); }, 350);
      }
    }
  }
}

/* Abre a tela de PIN somente quando o usuário tenta acessar "Senhas" */
function openSenhasLock() {
  pinBuffer = "";
  mode = data.pin ? "checkPin" : "createPin";
  document.getElementById('main').style.display = 'none';
  document.getElementById('lock').style.display = 'flex';
  renderLock();
}

function cancelLock() {
  pinBuffer = "";
  document.getElementById('recovery-question-input').value = "";
  document.getElementById('recovery-answer-input').value = "";
  document.getElementById('recovery-answer-check').value = "";
  document.getElementById('lock').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
}
window.cancelLock = cancelLock;

function confirmRecoverySetup() {
  const q = document.getElementById('recovery-question-input').value.trim();
  const a = document.getElementById('recovery-answer-input').value.trim();
  if (!q || !a) { showToast("Preencha a pergunta e a resposta"); return; }
  data.pin = data.pinPending;
  delete data.pinPending;
  data.recovery = { question: q, answer: a.toLowerCase() };
  document.getElementById('recovery-question-input').value = "";
  document.getElementById('recovery-answer-input').value = "";
  saveToCloud();
  finishSenhasUnlock();
}
window.confirmRecoverySetup = confirmRecoverySetup;

function startRecovery() {
  if (!data.recovery) { showToast("Nenhuma recuperação configurada"); return; }
  mode = "recoverAnswer";
  document.getElementById('recovery-question-display').textContent = data.recovery.question;
  renderLock();
}
window.startRecovery = startRecovery;

function checkRecoveryAnswer() {
  const val = document.getElementById('recovery-answer-check').value.trim().toLowerCase();
  document.getElementById('recovery-answer-check').value = "";
  if (data.recovery && val && val === data.recovery.answer) {
    mode = "resetPin";
    pinBuffer = "";
    renderLock();
    showToast("Resposta correta! Crie um novo PIN.");
  } else {
    showToast("Resposta incorreta");
  }
}
window.checkRecoveryAnswer = checkRecoveryAnswer;

function finishSenhasUnlock() {
  senhasUnlocked = true;
  document.getElementById('lock').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  activeTab = 'senhas';
  searchOpen = false;
  document.getElementById('search-wrap').classList.remove('open');
  document.getElementById('search-input').value = "";
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'senhas'));
  document.getElementById('section-title').textContent = TAB_ICON.senhas + " " + TAB_LABELS.senhas;
  renderList();
}

/* =========================== TABS =========================== */
function switchTab(tab) {
  if (tab === 'senhas' && !senhasUnlocked) {
    lockReturnTab = activeTab;
    openSenhasLock();
    return;
  }
  activeTab = tab;
  searchOpen = false;
  document.getElementById('search-wrap').classList.remove('open');
  document.getElementById('search-input').value = "";
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('section-title').textContent = TAB_ICON[tab] + " " + TAB_LABELS[tab];
  renderList();
}
window.switchTab = switchTab;

/* =========================== BUSCA E ORDENAÇÃO =========================== */
function toggleSearch() {
  searchOpen = !searchOpen;
  document.getElementById('search-wrap').classList.toggle('open', searchOpen);
  document.getElementById('search-btn').classList.toggle('active-state', searchOpen);
  if (searchOpen) document.getElementById('search-input').focus();
  else { document.getElementById('search-input').value = ""; renderList(); }
}
window.toggleSearch = toggleSearch;

function toggleSort() {
  sortMode = sortMode === "data" ? "titulo" : "data";
  document.getElementById('sort-current').textContent = sortMode === "data" ? "mais recentes" : "título (A-Z)";
  renderList();
}
window.toggleSort = toggleSort;

function titleOf(item) {
  return (activeTab === "senhas" ? item.site : item.title) || "";
}

/* =========================== LISTAGEM =========================== */
function renderList() {
  const el = document.getElementById('list');
  el.innerHTML = "";
  const query = document.getElementById('search-input').value.trim().toLowerCase();

  let items = [...data[activeTab]];

  if (query) {
    items = items.filter(item => {
      const haystack = [titleOf(item), item.body, item.user, item.notas, item.ingredientes, item.preparo]
        .filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(query);
    });
  }

  items.sort((a, b) => {
    if (sortMode === "titulo") {
      return titleOf(a).localeCompare(titleOf(b), 'pt-BR', {sensitivity:'base'});
    }
    if (activeTab === "lembretes") return new Date(a.whenISO) - new Date(b.whenISO);
    return (b.createdAt||0) - (a.createdAt||0);
  });

  if (items.length === 0) {
    const msgs = {
      rascunhos: query ? "Nada encontrado." : "Nenhum rascunho ainda.<br>Toque em \"+\" para escrever.",
      lembretes: query ? "Nada encontrado." : "Nenhum lembrete ainda.<br>Toque em \"+\" para criar um.",
      receitas: query ? "Nada encontrado." : "Nenhuma receita ainda.<br>Toque em \"+\" para adicionar.",
      senhas: query ? "Nada encontrado." : "Nenhuma senha guardada.<br>Toque em \"+\" para adicionar."
    };
    el.innerHTML = `<div class="empty"><span class="big">${query ? "🔎" : "🌤️"}</span>${msgs[activeTab]}</div>`;
    return;
  }

  const typeClass = { rascunhos: "rascunho", lembretes: "lembrete", receitas: "receita", senhas: "senha" }[activeTab];
  const badgeIcon = { rascunhos: "📝", lembretes: "🔔", receitas: "🍲", senhas: "🔑" }[activeTab];

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card ' + typeClass;
    div.onclick = () => openEditor(item.id);

    let bodyHtml = "", metaHtml = "";
    if (activeTab === "rascunhos") {
      bodyHtml = `<div class="card-body">${escapeHtml((item.body||"").slice(0,90))}</div>`;
    } else if (activeTab === "lembretes") {
      bodyHtml = `<div class="card-body">${escapeHtml((item.body||"").slice(0,80))}</div>`;
      metaHtml = `<div class="card-meta lembrete">🔔 ${formatDate(item.whenISO)}</div>`;
    } else if (activeTab === "receitas") {
      bodyHtml = `<div class="card-body">${escapeHtml((item.ingredientes||"").slice(0,90))}</div>`;
    } else {
      bodyHtml = `<div class="card-body">${escapeHtml(item.user || "")}</div>`;
      metaHtml = `<div class="card-meta senha">🔑 ••••••••</div>`;
    }

    div.innerHTML = `
      <div class="badge">${badgeIcon}</div>
      <div class="card-content">
        <div class="card-title">${escapeHtml(titleOf(item) || "Sem título")}</div>
        ${bodyHtml}
        ${metaHtml}
      </div>`;
    el.appendChild(div);
  });
}

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatDate(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}

/* =========================== EDITOR =========================== */
function openEditor(id) {
  currentEditId = id;
  ['rascunhos','lembretes','receitas','senhas'].forEach(t => {
    document.getElementById('fields-' + t).style.display = (t === activeTab) ? 'flex' : 'none';
  });

  const item = id ? data[activeTab].find(x => x.id === id) : null;
  document.getElementById('delete-btn').style.display = item ? 'inline' : 'none';

  if (activeTab === "rascunhos") {
    document.getElementById('rascunho-title').value = item ? item.title : "";
    document.getElementById('rascunho-body').value = item ? item.body : "";
  } else if (activeTab === "lembretes") {
    document.getElementById('lembrete-title').value = item ? item.title : "";
    document.getElementById('lembrete-body').value = item ? item.body : "";
    document.getElementById('lembrete-when').value = item && item.whenISO ? item.whenISO.slice(0,16) : "";
  } else if (activeTab === "receitas") {
    document.getElementById('receita-title').value = item ? item.title : "";
    document.getElementById('receita-ingredientes').value = item ? (item.ingredientes||"") : "";
    document.getElementById('receita-preparo').value = item ? (item.preparo||"") : "";
  } else {
    document.getElementById('senha-site').value = item ? item.site : "";
    document.getElementById('senha-user').value = item ? item.user : "";
    document.getElementById('senha-pass').value = item ? item.pass : "";
    document.getElementById('senha-pass').type = "password";
    document.getElementById('senha-notas').value = item ? (item.notas||"") : "";
  }

  document.getElementById('main').style.display = 'none';
  document.getElementById('editor').style.display = 'flex';
}
window.openEditor = openEditor;

function closeEditor() {
  document.getElementById('editor').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
  renderList();
}
window.closeEditor = closeEditor;

function togglePassVisibility() {
  const inp = document.getElementById('senha-pass');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
window.togglePassVisibility = togglePassVisibility;

async function saveCurrentItem() {
  const list = data[activeTab];

  if (activeTab === "rascunhos") {
    const title = document.getElementById('rascunho-title').value.trim();
    const body = document.getElementById('rascunho-body').value;
    if (!title && !body) return closeEditor();
    if (currentEditId) {
      const it = list.find(x => x.id === currentEditId);
      it.title = title; it.body = body;
    } else {
      list.push({ id: crypto.randomUUID(), title, body, createdAt: Date.now() });
    }
  } else if (activeTab === "lembretes") {
    const title = document.getElementById('lembrete-title').value.trim();
    const body = document.getElementById('lembrete-body').value;
    const whenVal = document.getElementById('lembrete-when').value;
    if (!title || !whenVal) { showToast("Preencha título e data"); return; }
    const whenISO = new Date(whenVal).toISOString();
    if (currentEditId) {
      const it = list.find(x => x.id === currentEditId);
      it.title = title; it.body = body; it.whenISO = whenISO;
    } else {
      list.push({ id: crypto.randomUUID(), title, body, whenISO, createdAt: Date.now() });
    }
  } else if (activeTab === "receitas") {
    const title = document.getElementById('receita-title').value.trim();
    const ingredientes = document.getElementById('receita-ingredientes').value;
    const preparo = document.getElementById('receita-preparo').value;
    if (!title && !ingredientes && !preparo) return closeEditor();
    if (currentEditId) {
      const it = list.find(x => x.id === currentEditId);
      it.title = title; it.ingredientes = ingredientes; it.preparo = preparo;
    } else {
      list.push({ id: crypto.randomUUID(), title, ingredientes, preparo, createdAt: Date.now() });
    }
  } else {
    const site = document.getElementById('senha-site').value.trim();
    const user = document.getElementById('senha-user').value.trim();
    const pass = document.getElementById('senha-pass').value;
    const notas = document.getElementById('senha-notas').value;
    if (!site) { showToast("Informe o site/serviço"); return; }
    if (currentEditId) {
      const it = list.find(x => x.id === currentEditId);
      it.site = site; it.user = user; it.pass = pass; it.notas = notas;
    } else {
      list.push({ id: crypto.randomUUID(), site, user, pass, notas, createdAt: Date.now() });
    }
  }

  await saveToCloud();
  scheduleAllReminders();
  showToast("Salvo ✓");
  closeEditor();
}
window.saveCurrentItem = saveCurrentItem;

async function deleteCurrentItem() {
  data[activeTab] = data[activeTab].filter(x => x.id !== currentEditId);
  await saveToCloud();
  scheduleAllReminders();
  showToast("Excluído");
  closeEditor();
}
window.deleteCurrentItem = deleteCurrentItem;

/* =========================== LEMBRETES / NOTIFICAÇÕES ===========================
   Notificações "push" reais (com o app fechado) exigem Service Worker +
   Firebase Cloud Messaging + um backend disparando no horário certo. Aqui,
   os lembretes disparam enquanto este app estiver aberto no navegador.
=========================================================================== */
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function scheduleAllReminders() {
  Object.values(scheduledTimers).forEach(t => clearTimeout(t));
  scheduledTimers = {};
  data.lembretes.forEach(n => {
    if (!n.whenISO) return;
    const delay = new Date(n.whenISO).getTime() - Date.now();
    if (delay <= 0 || delay > 2147000000) return;
    scheduledTimers[n.id] = setTimeout(() => fireReminder(n), delay);
  });
}

function fireReminder(item) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(item.title || "Lembrete", { body: item.body || "" });
  } else {
    showToast("🔔 " + (item.title || "Lembrete"));
  }
}

/* =========================== TOAST =========================== */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  const duration = Math.min(6000, Math.max(2200, msg.length * 55));
  toastTimer = setTimeout(() => t.classList.remove('show'), duration);
}

/* =========================== BOOT =========================== */
/* 1) Abre o app imediatamente com os dados salvos no aparelho (localStorage),
      sem depender de internet ou do Firebase.
   2) Em segundo plano, tenta conectar à nuvem; se conseguir, sincroniza.
      Se falhar (sem internet, rede bloqueada etc.), o app continua
      funcionando normalmente apenas com o armazenamento local. */
(async () => {
  try { loadFromLocalStorage(); } catch (e) { console.warn(e); }
  try { loadLastSyncFromLocal(); updateLastSyncLabel(); } catch (e) { console.warn(e); }

  document.getElementById('version-tag').textContent = 'v' + APP_VERSION;
  document.getElementById('main').style.display = 'flex';
  requestNotificationPermission();
  renderList();
  scheduleAllReminders();

  try {
    await initFirebase();
    if (firebaseReady) {
      await loadFromCloud();
      renderList();
      scheduleAllReminders();
    }
  } catch (e) {
    console.warn("Sincronização com a nuvem indisponível, app funcionando localmente:", e);
  }
})();
</script>
